<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EMSLRMVA Export Scrap System">
  <meta name="theme-color" content="#07111F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Scrap System">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <title>Scrap System</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #app-update-banner {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.28);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 700;
    }

    #app-update-banner button {
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      background: #2563eb;
      color: #ffffff;
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="app-update-banner" role="status" aria-live="polite">
    <span>New update available</span>
    <button type="button" id="app-update-refresh">Refresh now</button>
  </div>
  <script>
    (function () {
      const versionKey = 'scrap_system_web_build';
      const reloadKey = 'scrap_system_web_build_reload';
      const serviceWorkerCleanupKey = 'scrap_system_sw_cleanup_done';
      const checkIntervalMs = 15 * 60 * 1000;

      function latestVersionId(data) {
        return [
          data.version,
          data.build_number,
          data.build_signature,
          data.git_sha,
          data.github_run_number,
        ]
          .filter(Boolean)
          .join('+');
      }

      function versionedUrl(path, version) {
        const url = new URL(path, document.baseURI);
        if (version) {
          url.searchParams.set('v', version);
        }
        return url.toString();
      }

      function currentUrlWithVersion(version) {
        const url = new URL(window.location.href);
        url.searchParams.set('v', version);
        return url.toString();
      }

      function showUpdateBanner(nextVersion, message) {
        const banner = document.getElementById('app-update-banner');
        const refresh = document.getElementById('app-update-refresh');
        if (!banner || !refresh) {
          return;
        }
        const label = banner.querySelector('span');
        if (label && message) {
          label.textContent = message;
        }
        banner.style.display = 'flex';
        refresh.onclick = function () {
          try {
            window.localStorage.setItem(versionKey, nextVersion);
          } catch (_) {
            // Storage can be disabled; reload still gets the latest deployment.
          }
          window.location.replace(currentUrlWithVersion(nextVersion));
        };
      }

      async function clearOldFlutterCaches() {
        if (!('caches' in window)) {
          return;
        }
        const keys = await window.caches.keys();
        await Promise.all(
          keys
            .filter(function (key) {
              const lower = key.toLowerCase();
              return lower.includes('flutter') || lower.includes('scrap');
            })
            .map(function (key) {
              return window.caches.delete(key);
            })
        );
      }

      async function removeOldServiceWorkers() {
        if (!('serviceWorker' in navigator)) {
          return false;
        }
        const hadController = Boolean(navigator.serviceWorker.controller);
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(
          registrations.map(function (registration) {
            return registration.unregister();
          })
        );
        await clearOldFlutterCaches();
        return hadController || registrations.length > 0;
      }

      async function cleanupStaleRuntime() {
        try {
          const removedWorker = await removeOldServiceWorkers();
          if (
            removedWorker &&
            window.sessionStorage.getItem(serviceWorkerCleanupKey) !== 'done'
          ) {
            window.sessionStorage.setItem(serviceWorkerCleanupKey, 'done');
            window.location.reload();
            return true;
          }
        } catch (_) {
          // Flutter can still boot if browser storage APIs are blocked.
        }
        return false;
      }

      async function readLatestVersion() {
        const response = await fetch('version.json?ts=' + Date.now(), {
          cache: 'no-store',
        });
        if (!response.ok) {
          return '';
        }
        return latestVersionId(await response.json());
      }

      async function checkForWebUpdate(options) {
        const allowReload = Boolean(options && options.allowReload);
        try {
          const version = await readLatestVersion();
          if (!version) {
            return '';
          }
          const current = window.localStorage.getItem(versionKey);
          if (current && current !== version) {
            window.localStorage.setItem(versionKey, version);
            if (
              allowReload &&
              window.sessionStorage.getItem(reloadKey) !== version
            ) {
              window.sessionStorage.setItem(reloadKey, version);
              showUpdateBanner(version, 'Updating app...');
              window.location.replace(currentUrlWithVersion(version));
              return null;
            }
            showUpdateBanner(version, 'New update available');
            return version;
          }
          window.localStorage.setItem(versionKey, version);
          if (window.sessionStorage.getItem(reloadKey) === version) {
            window.sessionStorage.removeItem(reloadKey);
          }
          return version;
        } catch (_) {
          // Offline or first install; Flutter continues to boot normally.
          return '';
        }
      }

      function loadFlutter(version) {
        const script = document.createElement('script');
        script.src = versionedUrl(
          'flutter_bootstrap.js',
          version || Date.now().toString()
        );
        script.async = true;
        document.body.appendChild(script);
      }

      async function bootFlutterApp() {
        if (await cleanupStaleRuntime()) {
          return;
        }
        const version = await checkForWebUpdate({ allowReload: true });
        if (version === null) {
          return;
        }
        loadFlutter(version);
        window.setInterval(function () {
          checkForWebUpdate({ allowReload: true });
        }, checkIntervalMs);
      }

      bootFlutterApp();
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
</body>
</html>
