name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get packages
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href /scrap_management_system/

      - name: Stamp web build version
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version_file = Path("build/web/version.json")
          data = json.loads(version_file.read_text(encoding="utf-8"))
          sha = os.environ.get("GITHUB_SHA", "")
          data["build_signature"] = sha[:12]
          data["git_sha"] = sha
          data["github_run_number"] = os.environ.get("GITHUB_RUN_NUMBER", "")
          data["github_run_attempt"] = os.environ.get("GITHUB_RUN_ATTEMPT", "")
          data["deployed_at"] = datetime.now(timezone.utc).isoformat()
          version_file.write_text(json.dumps(data, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
